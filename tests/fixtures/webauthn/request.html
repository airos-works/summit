<!doctype html>
<meta charset="utf-8">
<title>webauthn request</title>
<style>body{font:16px sans-serif;margin:24px}button{font-size:18px;padding:10px 18px;margin-right:12px}#out{margin-top:20px;white-space:pre-wrap}</style>
<h1>Passkey request</h1>
<p>Each button makes a real WebAuthn request. Without a password manager
extension the browser answers it itself, and the window's status line says so.</p>
<button id="get">navigator.credentials.get()</button>
<button id="create">navigator.credentials.create()</button>
<div id="out">idle</div>
<script>
const out = document.getElementById('out');
const challenge = new Uint8Array(32);
const report = (label) => (result) => { out.textContent = label + ': ' + result; document.title = 'webauthn: ' + label + ' ' + result; };
document.getElementById('get').onclick = () => {
  out.textContent = 'get: pending';
  navigator.credentials.get({ publicKey: { challenge, timeout: 20000, userVerification: 'preferred' } })
    .then(c => report('get')('credential ' + (c && c.id)), e => report('get')(e.name + ' ' + e.message));
};
document.getElementById('create').onclick = () => {
  out.textContent = 'create: pending';
  navigator.credentials.create({ publicKey: { challenge, rp: { name: 'Summit test' },
    user: { id: new Uint8Array(16), name: 'test', displayName: 'Test' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }], timeout: 20000 } })
    .then(c => report('create')('credential ' + (c && c.id)), e => report('create')(e.name + ' ' + e.message));
};
</script>
