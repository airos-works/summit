<!doctype html>
<meta charset="utf-8">
<title>Grid row baselines across writing modes and relayout</title>
<style>
  #grid { display: inline-grid; position: relative; grid-template-columns: 100px 100px; align-items: baseline; font: 0/0 serif; }
  #peer { grid-area: 1 / 1; padding-bottom: 35px; }
  #peer span { display: inline-block; height: 40px; width: 10px; }
  #words { grid-area: 1 / 2; writing-mode: vertical-lr; }
  #words span { display: inline-block; inline-size: 60px; block-size: 10px; }
  #footer { grid-column: span 2; height: 25px; }
</style>
<div id="grid">
  <div id="peer"><span></span></div>
  <div id="words"><span></span><wbr><span></span><wbr><span></span></div>
  <div id="footer"></div>
</div>
<pre id="result"></pre>
<script>
const grid = document.getElementById('grid');
const peer = document.getElementById('peer');
const words = document.getElementById('words');
const footer = document.getElementById('footer');
const checks = [];

function check(name, rowHeight, itemHeight, peerTop) {
    const actual = [footer.offsetTop, words.offsetHeight, peer.offsetTop];
    const expected = [rowHeight, itemHeight, peerTop];
    checks.push({ name, actual, expected, pass: actual.every((value, index) => value === expected[index]) });
}

// The longest unbreakable word is 60px. Aligning it with the peer's 40px
// baseline adds 20px to the peer's 75px outer height.
check('intrinsically sized row', 95, 95, 55);
grid.style.height = '200px';
check('stretched auto rows', 135, 135, 95);
words.firstElementChild.style.inlineSize = '90px';
check('longer word', 150, 150, 110);
grid.insertBefore(words, peer);
check('reversed document order', 150, 150, 110);
grid.style.height = '';
check('intrinsically sized after editing', 125, 125, 85);
words.firstElementChild.style.inlineSize = '';
check('original word size restored', 95, 95, 55);
peer.style.alignSelf = 'start';
check('one baseline participant', 75, 75, 0);

document.getElementById('result').textContent = JSON.stringify(checks, null, 2);
</script>
