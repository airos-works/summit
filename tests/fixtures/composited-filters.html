<!doctype html>
<meta charset="utf-8">
<title>Composited filter comparison</title>
<style>
html, body { margin: 0; background: white; }
body { font: 14px sans-serif; width: 480px; height: 420px; }
#label { position: absolute; left: 16px; top: 8px; }
#art { position: absolute; left: 40px; top: 80px; width: 360px; height: 180px;
  background: repeating-linear-gradient(90deg, black 0 16px, white 16px 32px); will-change: transform; }
#glass { position: absolute; left: 120px; top: 130px; width: 160px; height: 80px;
  backdrop-filter: blur(20px); background: rgba(255,255,255,.1); }
#glow { display: none; position: absolute; left: 140px; top: 140px; width: 160px; height: 100px;
  background: #ff0000; filter: blur(40px); will-change: transform; }
#foreground { display: none; position: absolute; left: 250px; top: 150px; width: 40px; height: 40px;
  background: #0000ff; will-change: transform; }
body.blur #art, body.blur #glass { display: none; }
body.blur #glow, body.foreground #foreground { display: block; }
body.plain #art { will-change: auto; }
body.plain #glow { will-change: auto; }
</style>
<div id="label"></div><div id="art"></div><div id="glass"></div><div id="glow"></div><div id="foreground"></div>
<script>
const query = new URLSearchParams(location.search);
const mode = query.get('case') || 'backdrop';
document.body.classList.add(mode);
if (query.has('plain')) document.body.classList.add('plain');
document.getElementById('label').textContent = mode + (query.has('plain') ? ' / no will-change' : ' / composited');
window.filterProbe = {mode, dpr: devicePixelRatio, width: innerWidth, height: innerHeight,
  glass: {x:120,y:130,width:160,height:80}, glow: {x:140,y:140,width:160,height:100}};
</script>
