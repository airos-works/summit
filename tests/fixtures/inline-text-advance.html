<!doctype html>
<meta charset="utf-8">
<title>Inline boxes after fractional text advances</title>
<style>
  .row { position: absolute; top: 0; left: 0; margin: 0; inline-size: 400px; block-size: 60px; white-space: nowrap; font: 16px/1 serif; }
  .marker { display: inline-block; vertical-align: top; inline-size: 8.25px; block-size: 10px; }
  #flex { display: flex; }
</style>
<div class="row" id="flex"></div>
<div class="row" id="inline"></div>
<pre id="result"></pre>
<script>
const rows = [document.getElementById('flex'), document.getElementById('inline')];
const checks = [];
for (const writingMode of ['horizontal-tb', 'vertical-rl', 'vertical-lr']) {
    for (const direction of ['ltr', 'rtl']) {
        for (const letterSpacing of ['normal', '0.225px', '-0.325px']) {
            const positions = rows.map(row => {
                Object.assign(row.style, { writingMode, direction, letterSpacing });
                row.replaceChildren();
                for (let i = 0; i < 6; ++i) {
                    const marker = document.createElement('i');
                    marker.className = 'marker';
                    row.append(direction === 'ltr' ? 'Hi' : 'כן', marker);
                }
                return Array.from(row.children, marker => {
                    const rect = marker.getBoundingClientRect();
                    return writingMode === 'horizontal-tb' ? rect.x : rect.y;
                });
            });
            const [expected, actual] = positions;
            const pass = actual.every((position, index) => position === expected[index]);
            checks.push({ writingMode, direction, letterSpacing, expected, actual, pass });
        }
    }
}
rows.forEach(row => row.remove());
document.getElementById('result').textContent = JSON.stringify(checks, null, 2);
</script>
