<!doctype html>
<meta charset="utf-8">
<title>User preference media queries</title>
<!-- View › Reduce Motion and Increase Contrast (#118): each line says what
     the media query matches now, and changes live when a toggle changes. -->
<style>
  body { font: 16px sans-serif; margin: 2em; }
  .box { width: 6em; height: 6em; background: #48c; animation: spin 2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .box { animation: none; } }
  @media (prefers-contrast: more) { body { background: #000; color: #fff; } .box { background: #ff0; } }
</style>
<p id="motion"></p>
<p id="contrast"></p>
<div class="box"></div>
<script>
  for (const [id, feature, values] of [["motion", "prefers-reduced-motion", ["reduce", "no-preference"]],
                                       ["contrast", "prefers-contrast", ["more", "less", "custom", "no-preference"]]]) {
    const show = () => {
      const matched = values.filter((value) => matchMedia(`(${feature}: ${value})`).matches);
      document.getElementById(id).textContent = `${feature}: ${matched.join(", ") || "(none)"}`;
    };
    for (const value of values) matchMedia(`(${feature}: ${value})`).addEventListener("change", show);
    show();
  }
</script>
