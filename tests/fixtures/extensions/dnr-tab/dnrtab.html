<!doctype html><meta charset=utf-8><title>DNR tab rules</title>
<script>
// Each load asks afresh (no cached image), for the dnr-tab fixture's rules.
const stamp = Date.now() + Math.random();
for (const marker of ["tab", "excl"])
    document.write(`<img id=${marker} src="px.png?summit-dnr-${marker}&${stamp}">`);
function state() { return JSON.stringify({ tab: document.getElementById("tab").naturalWidth, excl: document.getElementById("excl").naturalWidth }); }
</script>
