<!doctype html>
<meta charset="utf-8">
<title>Debugger fixture page</title>
<style>body { margin: 0; font: 16px sans-serif } #button { position: absolute; left: 20px; top: 20px; width: 200px; height: 60px }
#field { position: absolute; left: 20px; top: 120px; width: 300px; height: 30px } #log { position: absolute; left: 20px; top: 180px }</style>
<button id="button">Click me</button>
<input id="field">
<pre id="log"></pre>
<script>
// What chrome.debugger's input reached: the fixture reads window.seen.
window.seen = { clicks: 0, keys: [], input: "" };
const log = (line) => { document.getElementById("log").textContent += line + "\n"; };
document.getElementById("button").addEventListener("click", (event) => { seen.clicks++; log(`click ${event.clientX},${event.clientY} trusted=${event.isTrusted}`); });
const field = document.getElementById("field");
field.addEventListener("keydown", (event) => seen.keys.push(event.key));
field.addEventListener("input", () => { seen.input = field.value; });
window.slow = (value, ms) => new Promise((resolve) => setTimeout(() => resolve(value), ms));
// A closed shadow root, which only dom.openOrClosedShadowRoot reaches.
const host = document.createElement("div");
host.id = "host";
host.attachShadow({ mode: "closed" }).innerHTML = "<b>closed shadow text</b>";
document.body.append(host);
console.log("fixture page loaded");
</script>
