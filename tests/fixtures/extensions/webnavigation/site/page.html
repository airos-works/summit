<!doctype html>
<meta charset="utf-8">
<title>webNavigation page</title>
<h1>webNavigation fixture</h1>
<p><a id="fragment" href="#one">fragment</a></p>
<p><a id="target" href="target.html" target="_blank">target="_blank"</a>
<button id="open" onclick="window.open('target.html?opened')">window.open()</button></p>
<iframe src="frame.html"></iframe>
<script>
// Same-document steps, one per second once loaded.
const steps = [
    () => document.getElementById('fragment').click(),
    () => history.pushState({ n: 1 }, '', 'page.html?pushed'),
    () => history.replaceState({ n: 2 }, '', 'page.html?replaced'),
    () => history.back(),
    () => history.forward(),
];
addEventListener('load', () => steps.forEach((step, i) => setTimeout(step, 1000 * (i + 1))));
</script>
