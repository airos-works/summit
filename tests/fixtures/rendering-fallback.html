<!doctype html>
<meta charset="utf-8">
<title>Rendering fallback and recovery</title>
<style>
  body { margin: 20px; font: 18px sans-serif; background: #fff; color: #17212b; }
  #swatches { display: flex; gap: 12px; margin: 20px 0; }
  .swatch { width: 120px; height: 90px; }
  #red { background: #dc2828; }
  #green { background: #28b450; }
  #blue { background: #285adc; }
  canvas { width: 240px; height: 120px; }
  #moving { background: #b42adc; width: 30px; height: 30px; }
  textarea { display: block; width: 400px; height: 50px; }
  #bottom { margin-top: 1200px; padding: 20px; background: #ffd040; }
</style>
<h1>Rendering fallback and recovery</h1>
<p>DOM animation, canvas pixels and entered text must survive a graphics failure.</p>
<div id="swatches"><div class="swatch" id="red"></div><div class="swatch" id="green"></div><div class="swatch" id="blue"></div></div>
<canvas id="paint" width="240" height="120"></canvas>
<div id="moving"></div>
<p>Animation frames: <output id="frames">0</output></p>
<textarea id="savedText">Text must remain in this document.</textarea>
<p><a href="?next=1">Navigate to a fresh document</a> · <a href="#bottom">Scroll to the bottom</a></p>
<pre id="capabilities"></pre>
<div id="bottom">The bottom of the page must paint after scrolling.</div>
<script>
window.renderingIdentity = crypto.randomUUID();
window.renderingFrames = 0;
const context = paint.getContext('2d');
context.fillStyle = '#14b4c8'; context.fillRect(0, 0, 120, 120);
context.fillStyle = '#f0a028'; context.fillRect(120, 0, 120, 120);
function tick() {
  ++window.renderingFrames;
  document.getElementById('frames').value = renderingFrames;
  moving.style.transform = `translateX(${renderingFrames % 180}px)`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
window.renderingCapabilities = ['webgl', 'webgl2'].map(type => {
  const gl = document.createElement('canvas').getContext(type);
  const result = { type, available: !!gl };
  gl?.getExtension('WEBGL_lose_context')?.loseContext();
  return result;
});
capabilities.textContent = JSON.stringify(renderingCapabilities);
window.renderingState = () => ({
  identity: renderingIdentity, frames: renderingFrames, text: savedText.value,
  webgl: renderingCapabilities, width: innerWidth, height: innerHeight,
  scrollY, canvasPixel: [...context.getImageData(10, 10, 1, 1).data],
  red: getComputedStyle(red).backgroundColor, deviceScale: devicePixelRatio
});
</script>
