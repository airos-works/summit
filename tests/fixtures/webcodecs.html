<!doctype html>
<meta charset="utf-8">
<title>WebCodecs fixture</title>
<!-- WebCodecs round trip (#112): for each codec, isConfigSupported, then
     encode six canvas frames of known colours, decode the chunks and check the
     decoded pictures' middle pixel; and a second of tone through Opus, AAC and MP3 (the RMS
     of a 0.5 sine is about 0.354). Results: #result (JSON) and the page. -->
<canvas id="source" width="320" height="240"></canvas>
<canvas id="check" width="320" height="240"></canvas>
<pre id="log"></pre>
<pre id="result"></pre>
<script>
const colours = [[255, 0, 0], [0, 255, 0], [0, 0, 255], [255, 255, 0], [0, 255, 255], [255, 0, 255]];
const codecs = [
    { name: 'VP8', codec: 'vp8' },
    { name: 'VP9', codec: 'vp09.00.10.08' },
    { name: 'H.264 (avc)', codec: 'avc1.42001f', avc: { format: 'avc' } },
    { name: 'H.264 (annexb)', codec: 'avc1.42001f', avc: { format: 'annexb' } },
];
const log = text => { document.getElementById('log').textContent += text + '\n'; };
const close = (a, b) => a.every((value, i) => Math.abs(value - b[i]) < 40);

async function roundTrip({ name, codec, avc }) {
    const config = { codec, width: 320, height: 240, bitrate: 1_000_000, framerate: 30 };
    if (avc)
        config.avc = avc;
    const encodeSupport = await VideoEncoder.isConfigSupported(config);
    const decodeSupport = await VideoDecoder.isConfigSupported({ codec, codedWidth: 320, codedHeight: 240 });
    if (!encodeSupport.supported || !decodeSupport.supported)
        return { name, encode: encodeSupport.supported, decode: decodeSupport.supported };
    const chunks = [];
    let decoderConfig;
    const encoder = new VideoEncoder({
        output: (chunk, metadata) => {
            if (metadata && metadata.decoderConfig)
                decoderConfig = metadata.decoderConfig;
            chunks.push(chunk);
        },
        error: error => log(`${name} encoder error: ${error.message}`),
    });
    encoder.configure(config);
    const source = document.getElementById('source').getContext('2d');
    for (let i = 0; i < colours.length; ++i) {
        source.fillStyle = `rgb(${colours[i].join(',')})`;
        source.fillRect(0, 0, 320, 240);
        const frame = new VideoFrame(document.getElementById('source'), { timestamp: i * 33333 });
        encoder.encode(frame, { keyFrame: i === 0 });
        frame.close();
    }
    await encoder.flush();
    encoder.close();

    const decoded = [];
    const check = document.getElementById('check').getContext('2d', { willReadFrequently: true });
    const decoder = new VideoDecoder({
        output: frame => {
            check.drawImage(frame, 0, 0, 320, 240);
            decoded.push({ timestamp: frame.timestamp, pixel: Array.from(check.getImageData(160, 120, 1, 1).data.slice(0, 3)) });
            frame.close();
        },
        error: error => log(`${name} decoder error: ${error.message}`),
    });
    decoder.configure(decoderConfig || { codec, codedWidth: 320, codedHeight: 240 });
    for (const chunk of chunks)
        decoder.decode(chunk);
    await decoder.flush();
    decoder.close();
    const matches = decoded.filter((entry, i) => close(entry.pixel, colours[i] || [])).length;
    return { name, encode: true, decode: true, chunks: chunks.length, keyFrames: chunks.filter(chunk => chunk.type === 'key').length,
        description: !!(decoderConfig && decoderConfig.description), decoded: decoded.length, matches,
        timestamps: decoded.map(entry => entry.timestamp).join(',') };
}

// One second of a 440 Hz tone (amplitude 0.5) as stereo f32-planar AudioData,
// through an encoder (default Opus; extra: e.g. { aac: { format: 'adts' } })
// and back: chunk count, decoded frames and loudness.
async function audioRoundTrip(rate, codec = 'opus', extra = {}) {
    const channels = 2, chunkFrames = rate / 100;
    const config = { codec, sampleRate: rate, numberOfChannels: channels, bitrate: 128000, ...extra };
    const encodeSupport = await AudioEncoder.isConfigSupported(config);
    const decodeSupport = await AudioDecoder.isConfigSupported({ codec, sampleRate: rate, numberOfChannels: channels });
    if (!encodeSupport.supported || !decodeSupport.supported)
        return { encode: encodeSupport.supported, decode: decodeSupport.supported };
    const chunks = [];
    let decoderConfig;
    const encoder = new AudioEncoder({
        output: (chunk, metadata) => {
            if (metadata && metadata.decoderConfig)
                decoderConfig = metadata.decoderConfig;
            chunks.push(chunk);
        },
        error: error => log(`audio encoder error: ${error.message}`),
    });
    encoder.configure(config);
    for (let start = 0; start < rate; start += chunkFrames) {
        const samples = new Float32Array(chunkFrames * channels);
        for (let i = 0; i < chunkFrames; ++i)
            samples[i] = samples[chunkFrames + i] = 0.5 * Math.sin(2 * Math.PI * 440 * (start + i) / rate);
        const data = new AudioData({ format: 'f32-planar', sampleRate: rate, numberOfFrames: chunkFrames, numberOfChannels: channels, timestamp: start * 1e6 / rate, data: samples });
        encoder.encode(data);
        data.close();
    }
    await encoder.flush();
    encoder.close();
    let frames = 0, sumSquares = 0, format, decodedRate;
    const decoder = new AudioDecoder({
        output: data => {
            format = data.format;
            decodedRate = data.sampleRate;
            const plane = new Float32Array(data.numberOfFrames);
            data.copyTo(plane, { planeIndex: 0, format: 'f32-planar' });
            for (const value of plane)
                sumSquares += value * value;
            frames += data.numberOfFrames;
            data.close();
        },
        error: error => log(`audio decoder error: ${error.message}`),
    });
    decoder.configure(decoderConfig || { codec, sampleRate: rate, numberOfChannels: channels });
    for (const chunk of chunks)
        decoder.decode(chunk);
    await decoder.flush();
    decoder.close();
    return { encode: true, decode: true, chunks: chunks.length, description: !!(decoderConfig && decoderConfig.description),
        frames, format, rms: Math.round(1000 * Math.sqrt(sumSquares / Math.max(frames, 1))) / 1000, decodedRate };
}

(async () => {
    const results = { webCodecs: typeof VideoEncoder === 'function' && typeof VideoDecoder === 'function', audio: typeof AudioEncoder === 'function', codecs: [] };
    if (results.webCodecs) {
        for (const codec of codecs) {
            try {
                results.codecs.push(await roundTrip(codec));
            } catch (error) {
                results.codecs.push({ name: codec.name, error: error.message });
            }
        }
    }
    if (results.audio) {
        try {
            results.opus = await audioRoundTrip(48000);
            // 44.1 kHz goes through libopus at 48 kHz.
            results.opus44 = await audioRoundTrip(44100);
        } catch (error) {
            results.opus = { error: error.message };
        }
        // AAC LC (raw with a description, and ADTS) and MP3, through FFmpeg.
        // And PCM (no compression: the tone comes back as it went, except A-law and mu-law's 8 bits).
        for (const [name, rate, codec, extra] of [['aac', 48000, 'mp4a.40.2', {}], ['aacADTS', 44100, 'mp4a.40.2', { aac: { format: 'adts' } }], ['mp3', 44100, 'mp3', {}],
            ['pcmU8', 48000, 'pcm-u8', {}], ['pcmS16', 48000, 'pcm-s16', {}], ['pcmS24', 48000, 'pcm-s24', {}], ['pcmS32', 48000, 'pcm-s32', {}], ['pcmF32', 48000, 'pcm-f32', {}],
            ['alaw', 8000, 'alaw', {}], ['ulaw', 8000, 'ulaw', {}]]) {
            try {
                results[name] = await audioRoundTrip(rate, codec, extra);
            } catch (error) {
                results[name] = { error: error.message };
            }
        }
    }
    document.getElementById('result').textContent = JSON.stringify(results);
    log(JSON.stringify(results, null, 1));
})();
</script>
