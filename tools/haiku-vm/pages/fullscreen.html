<!doctype html>
<meta charset="utf-8">
<title>fullscreen: click the page</title>
<!-- Click anywhere: the page asks for fullscreen (it needs a user gesture),
     and the title says whether it got it. -->
<style>html, body { height: 100%; margin: 0; cursor: pointer; }</style>
<body>
<script>
if (typeof document.documentElement.requestFullscreen !== "function")
    document.title = "fullscreen=no-api (" + (typeof document.documentElement.webkitRequestFullscreen) + ")";
document.addEventListener("fullscreenchange", () => {
    document.title = "fullscreen=" + (document.fullscreenElement ? "on" : "off");
});
document.body.addEventListener("click", () => {
    document.documentElement.requestFullscreen().catch(e => { document.title = "fullscreen=error:" + e.name; });
});
</script>
