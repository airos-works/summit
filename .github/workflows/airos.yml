# Builds Summit's engine (summit_webkit) and the browser (summit) as air/OS
# packages on every push to main, and nightly at 13:17 UTC, two hours before
# the image nightly, so every image has the latest main. Publishes them to the
# rolling "latest" release with links in the README (a nightly run of a commit
# already released only refreshes the package pool). The engine build is
# incremental; the first one takes hours. The pipeline itself lives in
# jmgasper/airos-ci (summit/, .github/workflows/summit.yml).
name: air/OS build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'artifacts/**']
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

jobs:
  airos:
    uses: jmgasper/airos-ci/.github/workflows/summit.yml@main
    permissions:
      contents: write
